# ACT-specific arguments
state_dim: 8
kl_weight: 10.0
chunk_size: 50
hidden_dim: 512
dim_feedforward: 3200

temporal_agg: true
device: cuda:0

# DETR parser args
ckpt_dir: null
policy_class: ACT
num_steps: 20000

# Model training params
batch_size: 64
save_freq: 1000
position_embedding: sine
lr_vision_backbone: 0.00001
weight_decay: 0.0001
lr: 0.00001
masks: false
dilation: false
backbone: resnet18
nheads: 8
enc_layers: 4
dec_layers: 7
pre_norm: false
dropout: 0.1
camera_names:
  - cam_high

# tactile args
tactile_names:
  - tac_left
  - tac_right
lr_tactile_backbone: 0.00001
tactile_masks: false
tactile_backbone: resnet18
# UniVTAC pretrained tactile ResNet18 (encoder/checkpoints/resnet18/20251128-125750/best.pth of UniVTAC),
# relative to the repo root
tactile_ckpt: checkpoints/univtac_resnet18_20251128-125750.pth
tactile_dilation: false


# World action model (ACT + future tactile latent prediction). One extra decoder query per
# (future frame, tactile stream) regresses the UniVTAC latent of that frame (L1, layer-normalized),
# from an EMA copy of the fine-tuned tactile backbone. The action queries attend to these queries
# through the decoder self-attention. Everything else equals train_config.yml, except num_steps.
wam_enabled: true
wam_tactile_future_stride: 5   # dataset frames between predicted frames
wam_tactile_future_steps: 6    # t+5 ... t+30
# wam_tactile_future_offsets: [2, 4, 6, 8]   # explicit offsets instead of stride x steps
wam_tactile_loss_weight: 1.0
wam_tactile_ema_decay: 0.999
